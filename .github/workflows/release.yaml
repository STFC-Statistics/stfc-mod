name: Create Release

on:
  push:
    tags:
      - "v*" # v0.6.1 or v0.6.1.alpha.9

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-24.04

    steps:
      # Find a successful Build workflow for this exact commit.
      #
      # Release intentionally reuses the artifacts from CI rather than
      # rebuilding Windows/macOS from the tag.
      - name: Find successful Build
        id: check_build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Checking for successful Build workflow for commit ${{ github.sha }}..."

          build_run_id="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "Build") | .id' \
              | head -n 1
          )"

          if [[ -z "$build_run_id" ]]; then
            echo "::error::No successful Build workflow found for commit ${{ github.sha }}."
            exit 1
          fi

          echo "Found successful Build run ID: $build_run_id"
          echo "build_run_id=$build_run_id" >> "$GITHUB_OUTPUT"

      # Prefer the Azure Artifact Signing output when the CI run produced one;
      # fall back to the unsigned build artifact otherwise.
      - name: Resolve Windows artifact
        id: windows_artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api \
              "/repos/${{ github.repository }}/actions/runs/${{ steps.check_build.outputs.build_run_id }}/artifacts?per_page=100" \
              --jq '.artifacts[].name' \
              | grep -qx "stfc-community-mod-signed"; then
            echo "name=stfc-community-mod-signed" >> "$GITHUB_OUTPUT"
          else
            echo "name=stfc-community-mod" >> "$GITHUB_OUTPUT"
          fi

      # Download only release-facing CI artifacts.
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.windows_artifact.outputs.name }}
          path: stfc-community-mod
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.check_build.outputs.build_run_id }}

      - name: Download macOS universal archive
        if: vars.SKIP_MACOS_BUILD != 'true'
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod-macos-universal
          path: stfc-community-mod-macos-universal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.check_build.outputs.build_run_id }}

      - name: Download macOS installer
        if: vars.SKIP_MACOS_BUILD != 'true'
        uses: actions/download-artifact@v8
        with:
          name: stfc-community-mod-installer
          path: stfc-community-mod-installer
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.check_build.outputs.build_run_id }}

      - name: Validate Build artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -f stfc-community-mod/version.dll

          if [[ "${{ vars.SKIP_MACOS_BUILD }}" != "true" ]]; then
            test -f \
              stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst

            test -f \
              stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256

            test -f \
              stfc-community-mod-installer/stfc-community-mod-installer.dmg
          fi

      # Legacy Windows ZIP.
      #
      # Keep both historical names as release assets.
      - name: Package legacy Windows ZIPs
        shell: bash
        run: |
          set -euo pipefail

          (
            cd stfc-community-mod
            zip -9 -q -r ../stfc-community-mod.zip .
          )

          cp \
            stfc-community-mod.zip \
            "stfc-community-mod-${{ github.ref_name }}.zip"

      # Native Windows archive used by newer installers/updaters.
      - name: Package Windows mod archive
        shell: bash
        run: |
          set -euo pipefail

          command -v zstd >/dev/null

          mkdir -p stfc-community-mod-windows-x64

          tar -cf - \
            -C stfc-community-mod \
            version.dll \
            | zstd -15 -T0 \
              -o stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst

          sha256sum \
            stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst \
            | awk '{print $1}' \
            > stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst.sha256

      - name: Check Prerelease
        id: check-prerelease
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.(alpha|beta)\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # macOS assets are only present when SKIP_MACOS_BUILD is not enabled on
      # the repository.
      - name: Resolve release assets
        id: release_assets
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "stfc-community-mod.zip"
            echo "stfc-community-mod-${{ github.ref_name }}.zip"
            echo "stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst"
            echo "stfc-community-mod-windows-x64/stfc-community-mod-windows-x64.tar.zst.sha256"
            if [[ "${{ vars.SKIP_MACOS_BUILD }}" != "true" ]]; then
              echo "stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst"
              echo "stfc-community-mod-macos-universal/stfc-community-mod-macos-universal.tar.zst.sha256"
              echo "stfc-community-mod-installer/stfc-community-mod-installer.dmg"
            fi
          } > .release-assets

          {
            echo "artifacts<<RELEASE_ASSETS_EOF"
            cat .release-assets
            echo "RELEASE_ASSETS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Create the release and upload every release asset in one action.
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

          generateReleaseNotes: true
          prerelease: ${{ steps.check-prerelease.outputs.prerelease }}

          artifactErrorsFailBuild: true

          artifacts: ${{ steps.release_assets.outputs.artifacts }}
